# Manifest of skills vendored into the makegood-skills aggregator plugin.
#
# Each entry pins a per-skill repo to a specific tagged release. Run
# scripts/sync_skills.py to refresh plugins/makegood-skills/skills/ from these
# pinned releases.
#
# To bump a skill: change its `tag`, run sync, commit, bump aggregator version
# in plugins/makegood-skills/.claude-plugin/plugin.json, tag a new aggregator
# release.

